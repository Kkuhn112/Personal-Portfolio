<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">PAROL 6 robotic arm project illustration</title>
  <desc id="desc">Stylized robotic arm on a workbench with a control screen in the background.</desc>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8dcc7"/><stop offset="1" stop-color="#8b7964"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#18233f"/><stop offset="0.55" stop-color="#283d64"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.42"/></filter>
  </defs>
  <rect width="1200" height="800" fill="#111827"/>
  <path d="M0 495h1200v305H0z" fill="url(#desk)"/>
  <path d="M0 0h1200v520H0z" fill="#31261e"/>
  <rect x="540" y="60" width="570" height="390" rx="24" fill="#020617" filter="url(#shadow)"/>
  <rect x="565" y="88" width="520" height="320" rx="14" fill="url(#screen)"/>
  <g opacity="0.9">
    <rect x="600" y="128" width="120" height="26" rx="6" fill="#38bdf8"/><rect x="750" y="128" width="120" height="26" rx="6" fill="#38bdf8" opacity="0.75"/><rect x="900" y="128" width="120" height="26" rx="6" fill="#38bdf8" opacity="0.75"/>
    <g fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700"><text x="610" y="210">Base</text><text x="610" y="265">Shoulder</text><text x="610" y="320">Elbow</text><text x="610" y="375">Wrist</text></g>
    <g stroke="#38bdf8" stroke-width="12" stroke-linecap="round"><path d="M760 205h155"/><path d="M760 260h190"/><path d="M760 315h115"/><path d="M760 370h165"/></g>
  </g>
  <g filter="url(#shadow)">
