    <circle cx="270" cy="625" r="78" fill="#dbe4ef" stroke="#94a3b8" stroke-width="18"/>
    <rect x="260" y="500" width="320" height="112" rx="38" transform="rotate(-18 260 500)" fill="url(#arm)"/>
    <circle cx="540" cy="475" r="84" fill="#dbe4ef" stroke="#94a3b8" stroke-width="18"/>
    <rect x="500" y="350" width="360" height="120" rx="42" transform="rotate(-42 500 350)" fill="url(#arm)"/>
    <circle cx="800" cy="280" r="74" fill="#dbe4ef" stroke="#94a3b8" stroke-width="16"/>
    <rect x="775" y="210" width="235" height="76" rx="24" transform="rotate(13 775 210)" fill="url(#arm)"/>
    <rect x="960" y="225" width="110" height="38" rx="10" transform="rotate(13 960 225)" fill="#cbd5e1"/>
    <rect x="990" y="185" width="28" height="118" rx="8" transform="rotate(13 990 185)" fill="#64748b"/>
    <g fill="#1e293b"><circle cx="270" cy="625" r="12"/><circle cx="540" cy="475" r="12"/><circle cx="800" cy="280" r="11"/><circle cx="630" cy="405" r="7"/><circle cx="675" cy="360" r="7"/><circle cx="720" cy="315" r="7"/></g>
    <path d="M545 463c55-45 130-102 205-158" fill="none" stroke="#0f172a" stroke-width="14" stroke-linecap="round" opacity="0.7"/>
    <path d="M760 294c58 4 115-5 172-26" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" opacity="0.7"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-width="8" opacity="0.9"><path d="M125 600c65-48 142-38 206-76" stroke="#38bdf8"/><path d="M145 625c80-55 150-35 235-95" stroke="#f97316"/><path d="M165 650c72-40 135-28 220-82" stroke="#ef4444"/></g>
  <g opacity="0.35" stroke="#020617" stroke-width="8" stroke-linecap="round"><path d="M770 625h270"/><path d="M820 665h230"/><path d="M690 705h180"/></g>
