name: Build Portfolio PDF

# Run this by hand from the Actions tab. It renders the two unlisted print
# pages and produces high-quality PDFs:
#   export.html -> the full portfolio
#   brief.html  -> the short one, three projects on two pages
on:
  workflow_dispatch:
    inputs:
      commit:
        description: "Commit the PDFs back to this branch"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Render full portfolio to PDF
        run: npm run pdf -- Kestin-Kuhn-Portfolio.pdf

      - name: Render brief portfolio to PDF
        run: npm run pdf:brief -- Kestin-Kuhn-Brief.pdf

      - name: Upload PDFs as downloadable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-pdfs
          path: |
            Kestin-Kuhn-Portfolio.pdf
            Kestin-Kuhn-Brief.pdf
          if-no-files-found: error

      - name: Commit updated PDFs
        if: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- Kestin-Kuhn-Portfolio.pdf Kestin-Kuhn-Brief.pdf; then
            echo "PDFs unchanged, nothing to commit."
          else
            git add Kestin-Kuhn-Portfolio.pdf Kestin-Kuhn-Brief.pdf
            git commit -m "Automatically update portfolio PDFs"
            git push
          fi
