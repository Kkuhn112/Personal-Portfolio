name: Build Resume PDF

on:
  push:
    paths:
      - "Kestin-Kuhn-Resume.tex"
      - ".github/workflows/build-resume.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile resume
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Kestin-Kuhn-Resume.tex
          latexmk_use_lualatex: true

      - name: Rename PDF for website
        run: cp Kestin-Kuhn-Resume.pdf Resume.pdf

      - name: Commit updated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Resume.pdf

          if git diff --cached --quiet; then
            echo "Resume PDF has not changed."
          else
            git commit -m "Automatically update resume PDF"
            git push
          fi