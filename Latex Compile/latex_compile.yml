name: Compile LaTeX to PDF

on:
  push:
    branches:
      - main  # Triggers the compilation every time you push to the main branch

jobs:
  build_latex:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Download your repository files into the runner environment
      - name: Set up Git repository
        uses: actions/checkout@v4

      # Step 2: Compile the LaTeX file
      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v3
        with:
          root_file: Kestin-Kuhn-Resume.tex  # Change this to match your actual main .tex filename

      # Step 3: Upload the finished PDF so you can download it
      - name: Upload Compiled PDF
        uses: actions/upload-artifact@v4
        with:
          name: compiled-pdf
          path: main.pdf 
